[project]
name = "solpay-data"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faker>=40.44.0",
    "google-genai>=2.34.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "psycopg[binary]>=3.3.7",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
