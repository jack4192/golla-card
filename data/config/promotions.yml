# 신한 SOL페이 이벤트·마이샵 혜택 (2026-11 기준, 원본: "SOL 페이 혜택 정보.xlsx", 중복 6건 제거한 31건)
#
# kind        event = 이벤트 (SOL페이 결제), myshop = 마이샵 (혜택 ON 설정 후 신한카드 결제)
# issuer      혜택을 주는 카드사. 둘 다 SHINHAN 카드로 결제할 때만 더한다 (결정 2026-11-11)
# match       가상 가맹점의 브랜드명과 맞출 때 쓰는 이름. 없으면 brand 를 쓴다
# amount      정액 혜택(원). rate 는 비율. 포인트·캐시백·즉시할인은 모두 1P = 1원으로 본다
# max_amount  '최대 혜택한도'. 결제 한 건의 상한으로 본다 (기간 누적 한도는 약관 확인 뒤 반영)
# needs_check 엔진이 확인할 수 없는 조건이 붙은 건. 표에는 두고 점수 계산에서는 뺀다
# 적용 횟수 제한은 원본에 없어 두지 않았다. 마이샵은 모든 사용자가 혜택 ON 을 켠 것으로 본다.
