    transit_default: SH_EVERYWHERE
    special: [pet]             # 특수 고액 결제 (pet 동물병원, golf 골프, car 자동차 정비)
    note: 최종 카드 DB test4 카드. 저녁·심야 편의점·배달. EVerywhere 생활 할인과 올원더풀 할인 PACK, HERO 구독·마트 적립의 경쟁

