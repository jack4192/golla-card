# 사용자 유형과 데모 사용자 5명
#
# 지금 단계에서는 소비 데이터만 만든다. 카드 선택은 혜택과 무관한 습관으로만 정하고,
# 혜택을 보고 고르는 행동과 실적 채우기는 실제 카드 상품을 매칭할 때 넣는다.
#
# habit: 카드를 고르는 방식의 비율 (합 1)
#   habit   습관 카드를 씀 (아래 choice_model에 따라 주 카드 또는 업종별 습관 카드)
#   random  보유 카드 중 무작위
# 시간대·업종·금액 분포는 distributions.yml에서 archetype별로 정한다.
#
# choice_model
#   main_card       기본 순서 1번 카드를 몰아 씀
#   category_habit  업종마다 늘 쓰는 카드가 정해져 있음 (사용자마다 처음에 한 번 정해 user_category_habits에 저장)
#                   main_prob 확률로 1번 카드, 아니면 나머지 카드 중 하나

archetypes:
  OFFICE:
    name: 직장인
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: category_habit, main_prob: 0.4 }
  STUDENT:
    name: 대학생
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: main_card }
  FAMILY:
    name: 맞벌이
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: category_habit, main_prob: 0.3 }
  HOME50:
    name: 출근 없는 50대
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: category_habit, main_prob: 0.3 }
  NIGHTOWL:
    name: 야근 직장인
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: main_card }
  REMOTE:
    name: 재택 근무자
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: main_card }

# 데모 사용자. cards는 기본 순서(display_order) 순이다. 카드는 최종 카드 DB 테스트 계정 test1~5와 같다 (2026-11-15).
# kpass_card: K-패스로 등록한 카드 (정부 환급 횟수는 이 카드로 탄 것만 센다)
# transit_default: 교통 대표 카드 (앱을 열지 않고 찍으면 이 카드로 결제)
# amount_level: 일반 결제 금액 배율. 공과금을 포함한 월 지출이 197만, 88만, 212만, 123만, 146만이 되도록 맞춘 값이다.
demo_users:
  - id: 1
    display_name: 데모 사용자 1
    archetype: OFFICE
    age_band: 30s
    gender: F
    zones: { home: BANGBAE, work: GANGNAM, weekend: SEONGSU }
    kpass_tier: general
    cards: [SH_DISCOUNT_PLAN_PLUS, SH_SOL_TRAVEL_CHECK, KB_ALL]
    amount_level: 0.892
    kpass_card: null
    transit_default: SH_DISCOUNT_PLAN_PLUS
    special: [golf, car]             # 특수 고액 결제 (pet 동물병원, golf 골프, car 자동차 정비)
    note: 메인 시연. 최종 카드 DB test1 카드. Discount Plan+ 오전 카페·음식점 10%(Time Plan)와 KB ALL 전 업종 할인, SOL트래블 편의점 적립의 경쟁

  - id: 2
    display_name: 데모 사용자 2
    archetype: STUDENT
    age_band: 20s
    gender: M
    zones: { home: SILLIM, work: SINCHON, weekend: HONGDAE }
    kpass_tier: youth
    cards: [HANA_MOVING_ALLDAY, NH_ZGM, LOTTE_LOCA_LIKIT]
    # 2026-11-18 결정: 모든 사용자가 신한카드를 갖는다. 4번째 카드로 더하고 1년 동안 가진 카드로 본다
    # (카드 번호는 배경 사용자 카드 다음 번호, 업종별 습관은 별도 난수로 다시 정한다. 다른 사용자 데이터는 그대로)
    added_cards: [SH_SOL_TRAVEL_CHECK]
    amount_level: 0.702
    kpass_card: null
    transit_default: HANA_MOVING_ALLDAY
    special: []             # 특수 고액 결제 (pet 동물병원, golf 골프, car 자동차 정비)
    note: 최종 카드 DB test2 카드 3장 + 신한 SOL트래블 체크(2026-11-18 추가). 소액 결제가 잦고, LOCA LIKIT 스타벅스·영화와 zgm 생활 10%, MOVING 일상 적립의 경쟁

  - id: 3
    display_name: 데모 사용자 3
    archetype: HOME50
    age_band: 50s
    gender: F
    zones: { home: JEONGJA, work: null, weekend: JEONGJA }
    kpass_tier: general
    cards: [BC_UPTURN, LOTTE_LIKIT_FUN_CHECK, KB_NORI2_CHECK]
    added_cards: [SH_SIMPLE_PLAN]       # 2026-11-18 추가 (test2 와 같은 방식)
    amount_level: 0.844
    kpass_card: null
    transit_default: null
    special: [pet, car]             # 특수 고액 결제 (pet 동물병원, golf 골프, car 자동차 정비)
    note: 최종 카드 DB test3 카드 3장 + 신한 Simple Plan(2026-11-18 추가). 평일 낮 동네 소비·병원, 주말 마트·주유. 업턴 주유·편의점·외식과 라이킷 펀 정액 캐시백, 노리2의 경쟁

  - id: 4
