# 사용자 유형과 데모 사용자 5명
#
# 지금 단계에서는 소비 데이터만 만든다. 카드 선택은 혜택과 무관한 습관으로만 정하고,
# 혜택을 보고 고르는 행동과 실적 채우기는 실제 카드 상품을 매칭할 때 넣는다.
#
# habit: 카드를 고르는 방식의 비율 (합 1)
#   habit   습관 카드를 씀 (아래 choice_model에 따라 주 카드 또는 업종별 습관 카드)
#   random  보유 카드 중 무작위
# 시간대·업종·금액 분포는 distributions.yml에서 archetype별로 정한다.
#
# choice_model
#   main_card       기본 순서 1번 카드를 몰아 씀
#   category_habit  업종마다 늘 쓰는 카드가 정해져 있음 (사용자마다 처음에 한 번 정해 user_category_habits에 저장)
#                   main_prob 확률로 1번 카드, 아니면 나머지 카드 중 하나

archetypes:
  OFFICE:
    name: 직장인
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: category_habit, main_prob: 0.4 }
  STUDENT:
    name: 대학생
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: main_card }
  FAMILY:
    name: 맞벌이
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: category_habit, main_prob: 0.3 }
  HOME50:
    name: 출근 없는 50대
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: category_habit, main_prob: 0.3 }
  NIGHTOWL:
    name: 야근 직장인
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: main_card }
  REMOTE:
    name: 재택 근무자
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: main_card }

# 데모 사용자. cards는 기본 순서(display_order) 순이다.
# kpass_card: K-패스로 등록한 카드 (정부 환급 횟수는 이 카드로 탄 것만 센다)
# transit_default: 교통 대표 카드 (앱을 열지 않고 찍으면 이 카드로 결제)
# amount_level: 일반 결제 금액 배율. 공과금을 포함한 월 지출이 197만, 88만, 212만, 123만, 146만이 되도록 맞춘 값이다.
demo_users:
  - id: 1
    display_name: 데모 사용자 1
    archetype: OFFICE
    age_band: 30s
    gender: F
    zones: { home: BANGBAE, work: GANGNAM, weekend: SEONGSU }
    kpass_tier: general
    cards: [SH_LIFE_CR, SH_DINE_CR, SH_KPASS_CR, KB_CAFE_CK, HN_DELI_CR]
    amount_level: 0.924
    kpass_card: SH_KPASS_CR
    transit_default: SH_KPASS_CR
    note: 메인 시연. 신한 생활 카드 카페 한도 소진 → KB 카드 1순위, 외식 카드 실적 28만/30만

  - id: 2
    display_name: 데모 사용자 2
    archetype: STUDENT
    age_band: 20s
    gender: M
    zones: { home: SILLIM, work: SINCHON, weekend: HONGDAE }
    kpass_tier: youth
    cards: [SH_KPASS_CR, SH_TRAVEL_CK, HN_TRAVEL_CK]
    amount_level: 0.802
    kpass_card: SH_KPASS_CR
    transit_default: SH_KPASS_CR
    note: 소액 결제가 잦음, K-패스 월 15회 기준

  - id: 3
    display_name: 데모 사용자 3
    archetype: HOME50
    age_band: 50s
    gender: F
    zones: { home: JEONGJA, work: null, weekend: JEONGJA }
    kpass_tier: general
    cards: [SH_SHOP_CR, WR_FLAT_CR, WR_LIFE_CK, KB_KPASS_CR]
    amount_level: 0.953
    kpass_card: KB_KPASS_CR
    transit_default: KB_KPASS_CR
    note: 평일 낮 동네 소비·홈쇼핑·병원, 주말 마트·주유, 통합할인 카드와 특화 카드의 경쟁

  - id: 4
    display_name: 데모 사용자 4
    archetype: NIGHTOWL
    age_band: 20s
    gender: M
    zones: { home: MANGWON, work: GASAN, weekend: MANGWON }
    kpass_tier: youth
    cards: [SH_LIFE_CR, HN_DELI_CR, KB_KPASS_CR, SH_BASIC_CK]
