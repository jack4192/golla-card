# 결제 분포. 금액(amount)은 대형마트·슈퍼를 빼고 제공 데이터로 보정했고, 나머지는 가정값이다.

noise: 0.15   # 이 비율만큼은 평소 패턴과 무관한 종류를 뽑는다
# 잡음으로 뽑을 수 있는 종류 (교통·학원·자동이체는 빼고, 가끔 가는 곳 위주)
noise_kinds: [CAFE, CVS, REST, FASTFOOD, BAKERY, SALAD, DELIVERY, MART, SUPER, ONLINE, FUEL, MOVIE, BOOK, HNB, DEPT,
              OUTLET, MEDICAL, TAXI, STATIONERY, PHOTO, HAIR, PARKING, OPTICAL, EBOOK, APPSTORE]
# 생성기의 '종류'(places.yml kinds)를 쓴다. 결제에 찍히는 업종은 가맹점의 실제 업종 코드다.

# 공휴일은 주말처럼 다룬다. 2026년 대체공휴일·추석 날짜는 확인 필요. 제헌절은 2026년 공휴일 재지정 보도 기준.
holidays: [2025-12-25, 2026-01-01, 2026-02-16, 2026-02-17, 2026-02-18, 2026-03-02, 2026-05-05, 2026-05-25, 2026-06-03, 2026-07-17, 2026-08-17, 2026-09-24, 2026-09-25, 2026-10-05, 2026-10-09]   # 2026 설날 2/16~18, 삼일절·부처님오신날 대체공휴일, 6/3 지방선거

slots:
  MORNING:   [7, 8, 9, 10]
  LUNCH:     [11, 12, 13]
  AFTERNOON: [14, 15, 16, 17]
  EVENING:   [18, 19, 20, 21]
  NIGHT:     [22, 23]

# 시간대 안에서 시각을 뽑는 분포 (2026-11-14 결정). 이전에는 위 시각 중 하나를 고르고 분을 고르게 뽑아
# 음식점이 11·12·13시에 똑같이 몰리고 14시부터 0%가 되는 계단 모양이었다. 정규분포 [중심 시각, 표준편차(시간)]로 뽑고
# 6시~23시59분 밖이면 잘라 낸다 (0~5시는 아래 dawn 이 따로 만든다).
slot_time:
  MORNING:   [8.7, 1.0]
  LUNCH:     [12.6, 0.8]
  AFTERNOON: [15.8, 1.1]
  EVENING:   [19.6, 1.1]
  NIGHT:     [22.9, 0.6]
slot_time_bounds: [6.0, 23.98]

# 주말·공휴일 금액 배율 (가정값). 주말 외식은 여럿이 먹어 금액이 크고, 쇼핑도 커진다.
weekend_amount_mult: { REST: 1.25, CAFE: 1.1, BAKERY: 1.1, DEPT: 1.2, OUTLET: 1.2, MART: 1.15, SUPER: 1.1 }

# 심야 결제 (전부 가정값). 평소 결제와 따로 더해서 다른 시간대의 분포는 건드리지 않는다.
#   per_day         하루 평균 건수 (유형 배율과 사용자별 건수 배율을 곱한다)
#   hour_weight     시각별 비중. 0시가 가장 많고 새벽으로 갈수록 준다.
#   category_weight 새벽에 결제할 만한 업종만 둔다 (noise를 적용하지 않음)
dawn:
  per_day: 0.06
  archetype_mult: { NIGHTOWL: 2.0, STUDENT: 1.5, FAMILY: 0.5, HOME50: 0.5 }
  hour_weight: { 0: 40, 1: 25, 2: 15, 3: 10, 4: 7, 5: 3 }
  category_weight: { ONLINE: 35, CVS: 35, TAXI: 15, DELIVERY: 15 }

# 충동·대형 결제 (전부 가정값, 배경 사용자만). 가전·항공권은 온라인, 명품은 의류, 큰 병원비는 병원·약국에 넣는다.
#   median  유형 금액 배율과 사용자별 금액 배율을 곱한다 (씀씀이가 큰 사람이 더 크게 쓴다)
#   range   이 범위 밖이면 다시 뽑는다
impulse:
  per_month: 0.33
  sigma: 0.60
  range: [300000, 2000000]
  category:
    ONLINE:  { weight: 45, median: 500000 }
    DEPT:    { weight: 30, median: 450000 }
    MEDICAL: { weight: 25, median: 500000, only: HOSPITAL }   # 큰 의료비는 병원만 (약국 제외, 2026-11-16)

# 시간대별로 결제하는 동네. home/work/weekend는 사용자 설정의 동네를 가리킨다.
# 회사가 없는 사용자(재택)는 work 대신 home을 쓴다.
zone_by_slot:
  weekday: { DAWN: home, MORNING: work, LUNCH: work, AFTERNOON: work, EVENING: { work: 0.5, home: 0.5 }, NIGHT: home }
  weekend: { DAWN: home, MORNING: home, LUNCH: { weekend: 0.6, home: 0.4 }, AFTERNOON: { weekend: 0.6, home: 0.4 }, EVENING: { weekend: 0.5, home: 0.5 }, NIGHT: home }

# 같은 동네·업종에서는 단골 3곳 중 하나를 고를 확률 (데모 사용자. 배경 사용자는 population.yml의 범위를 쓴다)
favorite_prob: 0.7

# 주말·공휴일에 업종 가중치에 곱하는 값 (모든 유형 공통, 유형별 값이 있으면 그걸 씀)
weekend_boost: { MART: 2.0, MOVIE: 2.0, DEPT: 1.5, OUTLET: 2.0, FUEL: 1.5, THEMEPARK: 4.0 }

archetypes:
  OFFICE:
    per_day: { weekday: 3.0, weekend: 2.5 }
    amount_mult: 1.0
    slot_weight:
      weekday: { MORNING: 0.22, LUNCH: 0.30, AFTERNOON: 0.15, EVENING: 0.25, NIGHT: 0.08 }
      weekend: { MORNING: 0.10, LUNCH: 0.30, AFTERNOON: 0.25, EVENING: 0.28, NIGHT: 0.07 }
    category_weight:
      MORNING:   { CAFE: 45, CVS: 25, BAKERY: 15, FASTFOOD: 8, MEDICAL: 5, PARKING: 2 }
      LUNCH:     { REST: 58, CAFE: 25, FASTFOOD: 8, SALAD: 4, MEDICAL: 3, CVS: 2 }
      AFTERNOON: { CAFE: 30, CVS: 22, ONLINE: 20, HNB: 8, DEPT: 4, OUTLET: 2, MEDICAL: 5, BOOK: 3, HAIR: 2, OPTICAL: 1, STATIONERY: 1, APPSTORE: 2, EASYPAY: 2, TICKET: 1 }
      EVENING:   { REST: 33, DELIVERY: 20, CVS: 14, SUPER: 10, MART: 5, MOVIE: 4, BOOK: 2, TAXI: 5, FITNESS: 4, PARKING: 2, PHOTO: 1 }
      NIGHT:     { CVS: 45, DELIVERY: 33, ONLINE: 20, APPSTORE: 2, FRESH: 2, EBOOKAPP: 1 }
    commute: { days: weekday, out: [8, 0, 30], back: [19, 0, 45] }   # [시, 분, 표준편차(분)]

  STUDENT:
    per_day: { weekday: 2.5, weekend: 2.2 }
    amount_mult: 0.6
    slot_weight:
      weekday: { MORNING: 0.15, LUNCH: 0.30, AFTERNOON: 0.25, EVENING: 0.20, NIGHT: 0.10 }
      weekend: { MORNING: 0.05, LUNCH: 0.30, AFTERNOON: 0.30, EVENING: 0.25, NIGHT: 0.10 }
    category_weight:
      MORNING:   { CAFE: 33, CVS: 38, BAKERY: 14, FASTFOOD: 10, STATIONERY: 5 }
      LUNCH:     { REST: 43, FASTFOOD: 23, SALAD: 4, CAFE: 20, CVS: 10 }
      AFTERNOON: { CAFE: 30, CVS: 25, STUDY: 10, ONLINE: 12, BOOK: 5, EBOOK: 3, HNB: 6, PHOTO: 4, STATIONERY: 3, APPSTORE: 2, EASYPAY: 3, TICKET: 2, EBOOKAPP: 2 }
      EVENING:   { REST: 28, CVS: 18, FASTFOOD: 14, DELIVERY: 14, MOVIE: 8, CAFE: 8, STUDY: 6, PHOTO: 4 }
      NIGHT:     { CVS: 52, DELIVERY: 24, ONLINE: 18, APPSTORE: 6 }
    commute: { days: weekday, out: [9, 0, 50], back: [18, 0, 90] }

  FAMILY:
    per_day: { weekday: 2.0, weekend: 3.5 }
    amount_mult: 1.0
    slot_weight:
      weekday: { MORNING: 0.15, LUNCH: 0.25, AFTERNOON: 0.15, EVENING: 0.35, NIGHT: 0.10 }
      weekend: { MORNING: 0.10, LUNCH: 0.30, AFTERNOON: 0.30, EVENING: 0.25, NIGHT: 0.05 }
    category_weight:
      MORNING:   { CAFE: 40, BAKERY: 30, CVS: 18, MEDICAL: 10, PARKING: 2 }
      LUNCH:     { REST: 60, CAFE: 30, FASTFOOD: 10 }
      AFTERNOON: { ONLINE: 25, CAFE: 18, MEDICAL: 15, SUPER: 14, HNB: 8, DEPT: 5, OUTLET: 3, BAKERY: 4, HAIR: 3, PARKING: 3, OPTICAL: 1, THEMEPARK: 1, FRESH: 4, TICKET: 1, EASYPAY: 2 }
      EVENING:   { SUPER: 24, REST: 24, MART: 20, DELIVERY: 15, FUEL: 10, CVS: 4, PARKING: 3 }
      NIGHT:     { ONLINE: 50, CVS: 30, DELIVERY: 20, FRESH: 5 }
    weekend_boost: { MART: 2.0, FUEL: 2.0, DEPT: 1.5, OUTLET: 2.0, MOVIE: 2.0, THEMEPARK: 4.0, PARKING: 1.5 }
    commute: { days: weekday, out: [8, 30, 20], back: [18, 30, 30] }
    monthly_fixed: [ { category: EDU, day_range: [1, 15], amount_range: [150000, 450000] } ]   # 학원비. 납부일·금액을 사용자마다 한 번 정해 매달 같게 (자동이체)

  # 데모 3번 전용. 맞벌이를 바탕으로 출근을 빼고 평일 낮 결제를 늘렸다.
  # 제공 데이터 근거: 삼성카드 온라인쇼핑 50대 여성의 홈쇼핑 39.2%, 오전 6~10시 15.7%.
  # 가정값: 병원·약국과 슈퍼 1.5배, 배달과 카페 0.7배 (오프라인 업종의 연령별 자료가 없음).
  HOME50:
    per_day: { weekday: 2.6, weekend: 2.0 }
    amount_mult: 1.0
    home_shopping_share: 0.4    # 온라인 결제 중 홈쇼핑 비율
    slot_weight:
      weekday: { MORNING: 0.22, LUNCH: 0.25, AFTERNOON: 0.30, EVENING: 0.18, NIGHT: 0.05 }
      weekend: { MORNING: 0.15, LUNCH: 0.30, AFTERNOON: 0.30, EVENING: 0.20, NIGHT: 0.05 }
    category_weight:
      MORNING:   { BAKERY: 30, CAFE: 28, CVS: 20, MEDICAL: 15, ONLINE: 8 }
      LUNCH:     { REST: 60, CAFE: 21, FASTFOOD: 10, MEDICAL: 5 }
      AFTERNOON: { ONLINE: 25, MEDICAL: 22, SUPER: 22, CAFE: 14, HNB: 7, DEPT: 6, OUTLET: 2, HAIR: 4, OPTICAL: 2, BAKERY: 5, FITNESS: 2, FRESH: 4, TICKET: 1 }
      EVENING:   { SUPER: 38, REST: 25, MART: 20, DELIVERY: 10, FUEL: 10, CVS: 5 }
      NIGHT:     { ONLINE: 50, CVS: 30, DELIVERY: 14, FRESH: 4 }
    weekend_boost: { MART: 2.0, FUEL: 2.0, DEPT: 1.5, OUTLET: 2.0, MOVIE: 2.0 }
    commute: { days: none }
    rides_per_day: { weekday: 0.7, weekend: 0.7 }   # 출퇴근 대신 낮에 다니는 버스·지하철
    monthly_fixed: [ { category: EDU, day_range: [1, 15], amount_range: [150000, 450000] } ]   # 학원비. 납부일·금액을 사용자마다 한 번 정해 매달 같게 (자동이체)

  NIGHTOWL:
    per_day: { weekday: 2.5, weekend: 2.0 }
    amount_mult: 1.0
    slot_weight:
      weekday: { MORNING: 0.15, LUNCH: 0.30, AFTERNOON: 0.15, EVENING: 0.20, NIGHT: 0.20 }
      weekend: { MORNING: 0.05, LUNCH: 0.30, AFTERNOON: 0.25, EVENING: 0.20, NIGHT: 0.20 }
    category_weight:
      MORNING:   { CAFE: 50, CVS: 35, BAKERY: 15 }
      LUNCH:     { REST: 53, CAFE: 25, FASTFOOD: 18, SALAD: 4 }
      AFTERNOON: { CAFE: 43, CVS: 28, ONLINE: 23, HNB: 3, APPSTORE: 3, EASYPAY: 2 }
      EVENING:   { REST: 28, CVS: 24, DELIVERY: 24, FASTFOOD: 18, FITNESS: 4, PHOTO: 2 }
      NIGHT:     { CVS: 40, DELIVERY: 38, TAXI: 10, ONLINE: 9, APPSTORE: 3, EBOOKAPP: 2 }
    commute: { days: weekday, out: [9, 30, 30], back: [22, 0, 40] }

  REMOTE:
    per_day: { weekday: 2.0, weekend: 2.0 }
    amount_mult: 1.0
    slot_weight:
      weekday: { MORNING: 0.15, LUNCH: 0.30, AFTERNOON: 0.25, EVENING: 0.20, NIGHT: 0.10 }
      weekend: { MORNING: 0.15, LUNCH: 0.30, AFTERNOON: 0.25, EVENING: 0.20, NIGHT: 0.10 }
    category_weight:
      MORNING:   { CAFE: 40, BAKERY: 30, CVS: 30 }
      LUNCH:     { DELIVERY: 40, REST: 33, FASTFOOD: 13, SALAD: 4, CVS: 10 }
      AFTERNOON: { ONLINE: 37, CAFE: 33, SUPER: 9, BOOK: 6, EBOOK: 3, MEDICAL: 5, HAIR: 2, FITNESS: 3, APPSTORE: 2, FRESH: 3, EBOOKAPP: 2, EASYPAY: 2 }
      EVENING:   { REST: 28, DELIVERY: 24, SUPER: 19, ONLINE: 14, MOVIE: 9, FITNESS: 4, HNB: 2 }
      NIGHT:     { ONLINE: 43, CVS: 30, DELIVERY: 25, APPSTORE: 2 }
    commute: { days: twice_a_week, out: [10, 0, 60], back: [17, 0, 60] }

# 업종별 결제 금액: 로그정규분포 [중앙값(원), 퍼짐 sigma]. 100원 단위로 맞춘다.
# 생성 결과의 업종 평균이 제공 데이터(2020년 신한카드 시군구별·온라인소비, 구별 중앙값)에 맞도록 역산한 값이다.
#   by_slot  시간대마다 분포가 다르다. 음식점 점심·저녁 나눔은 제공 데이터에 없는 가정이고, 전체 평균을 맞췄다.
#   mix      종류가 섞인 업종. 병원·약국은 건수가 비슷해서 반반으로 뽑는다.
# 패스트푸드·제과·뷰티·택시는 기존 가정값을 유지한다 (제공 데이터와 비슷하거나, 등록지 왜곡·분류 차이로 비교 불가).
amount:
  CAFE: [6800, 0.35]
  CVS: [5800, 0.60]
  REST:
    by_slot:
      MORNING: [15000, 0.35]
      LUNCH: [15000, 0.35]
      AFTERNOON: [15000, 0.35]
      EVENING: [48000, 0.35]
      NIGHT: [48000, 0.35]
  FASTFOOD: [9000, 0.30]
  BAKERY: [8000, 0.45]
  DELIVERY: [21500, 0.35]
  MART: [70000, 0.55]    # 장보기 금액을 반영한 가정값 (제공 데이터 평균은 40,100원)
  SUPER: [30000, 0.55]   # 장보기 금액을 반영한 가정값 (제공 데이터 평균은 16,500원)
  ONLINE: [41000, 0.70]
  FUEL: [44000, 0.30]
  MOVIE: [16000, 0.25]
  BOOK: [32000, 0.45]
  HNB: [22000, 0.50]
  DEPT: [85000, 0.60]
  OUTLET: [70000, 0.55]
  MEDICAL:   # 가맹점의 실제 업종으로 금액을 나눈다. 약국은 1건 최대 15만 원 (2026-11-16 결정)
    by_category:
      PHARMACY: [12500, 0.60]
      HOSPITAL: [34000, 0.80]
    cap: { PHARMACY: 150000 }
  TAXI: [12000, 0.45]
  # 새 종류 (전부 가정값)
  SALAD: [9500, 0.25]
  STUDY: [8000, 0.40]        # 스터디카페 시간권
  STATIONERY: [6000, 0.60]
  PHOTO: [5000, 0.20]
  HAIR: [30000, 0.50]
  FITNESS: [60000, 0.50]     # 회원권·PT 등록을 결제 한 번으로 본다
  PARKING: [4000, 0.60]
  OPTICAL: [80000, 0.50]
  THEMEPARK: [55000, 0.30]
  EBOOK: [18000, 0.40]
  APPSTORE: [5500, 0.60]
  # 혜택은 있는데 결제가 없던 업종 (2026-11-14 결정, 전부 가정값)
  EASYPAY: [20000, 0.60]     # 간편결제 (네이버페이·카카오페이 결제)
  TICKET: [60000, 0.50]      # 공연·전시 티켓
  EBOOKAPP: [11000, 0.40]    # 전자도서 구매
  FRESH: [45000, 0.40]       # 신선식품몰 (컬리·오아시스)

# 자동이체 승인 시각 (가정값, 2026-11-16 결정): 새벽 일괄 처리 60%, 오전 30%, 오후 10%
debit_time:
  dawn:      { weight: 60, hours: [0, 6] }
  morning:   { weight: 30, hours: [6, 12] }
  afternoon: { weight: 10, hours: [12, 18] }

# 교통 요금 (확인 필요). 거리 추가 요금은 아래 값 중 하나를 무작위로 더한다.
transit:
  modes: { 수도권 지하철: [1550, 0.7], 서울 시내버스: [1500, 0.3] }   # [기본요금, 비율]
  surcharge: [0, 0, 0, 100, 200]
  weekend_rides_per_day: 1.0

# 자동이체 (가정값). 통신비는 사용자마다 범위 안에서 한 번 정해 매달 같은 금액.
recurring:
  # 납부일은 사용자마다 이 중 하나 (31 = 말일, 2026-11-16 결정)
  TELECOM: { days: [5, 10, 15, 20, 25, 31], amount_range: [45000, 85000] }
  # 구독 (OTT·멤버십·음악/전자책). 가맹점 이름 → 월 금액. 업종은 가맹점 표에서 정해진다.
  SUBSCR:
    count_range: [0, 3]
    # 웨이브·ChatGPT·Claude·스포티파이·FLO·배민클럽은 최종 카드 DB 혜택 대상이라 추가 (2026-11-15, 월 요금 가정값)
    prices: { 넷플릭스: 13500, 유튜브프리미엄: 14900, 티빙: 13900, 디즈니+: 9900, 쿠팡와우: 7890, 네이버플러스 멤버십: 4900, 멜론: 10900, 밀리의서재: 9900,
              웨이브: 10900, ChatGPT: 29000, Claude: 29000, 스포티파이: 10900, FLO: 10900, 배민클럽: 3990 }
  # 공과금 (가정값). 제공 데이터의 월납/세금은 강남구·중구 등록지에 몰려 있어 비중은 쓰지 않고,
  # 다른 구의 건당 3만~8만 원 수준만 참고했다. 납부일은 사용자마다 한 번 정하고 금액은 달마다 달라진다.
  #   amount      로그정규분포 [중앙값(원), 퍼짐 sigma]
  #   month_mult  달별 배율 (냉방·난방)
  #   only        이 유형만 낸다 (없으면 전체)
  UTILITY:
    payer_share: { STUDENT: 0.5 }   # 공과금을 내는 사람의 비율 (자취생만 낸다고 본다, 없으면 전원)
    items:
