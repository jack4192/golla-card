# 결제 분포. 금액(amount)은 제공 데이터로 보정했고, 나머지는 가정값이다.

noise: 0.15   # 이 비율만큼은 평소 패턴과 무관한 업종을 뽑는다

# 공휴일은 주말처럼 다룬다. 2026년 대체공휴일·추석 날짜는 확인 필요.
holidays: [2026-08-17, 2026-09-24, 2026-09-25, 2026-10-05, 2026-10-09]

slots:
  MORNING:   [7, 8, 9, 10]
  LUNCH:     [11, 12, 13]
  AFTERNOON: [14, 15, 16, 17]
  EVENING:   [18, 19, 20, 21]
  NIGHT:     [22, 23]

# 심야 결제 (전부 가정값). 평소 결제와 따로 더해서 다른 시간대의 분포는 건드리지 않는다.
#   per_day         하루 평균 건수 (유형 배율과 사용자별 건수 배율을 곱한다)
#   hour_weight     시각별 비중. 0시가 가장 많고 새벽으로 갈수록 준다.
#   category_weight 새벽에 결제할 만한 업종만 둔다 (noise를 적용하지 않음)
dawn:
  per_day: 0.06
  archetype_mult: { NIGHTOWL: 2.0, STUDENT: 1.5, FAMILY: 0.5, HOME50: 0.5 }
  hour_weight: { 0: 40, 1: 25, 2: 15, 3: 10, 4: 7, 5: 3 }
  category_weight: { ONLINE: 35, CVS: 35, TAXI: 15, DELIVERY: 15 }

# 충동·대형 결제 (전부 가정값, 배경 사용자만). 가전·항공권은 온라인, 명품은 의류, 큰 병원비는 병원·약국에 넣는다.
#   median  유형 금액 배율과 사용자별 금액 배율을 곱한다 (씀씀이가 큰 사람이 더 크게 쓴다)
#   range   이 범위 밖이면 다시 뽑는다
impulse:
  per_month: 0.33
  sigma: 0.60
  range: [300000, 2000000]
  category:
    ONLINE:  { weight: 45, median: 500000 }
    APPAREL: { weight: 30, median: 450000 }
    MEDICAL: { weight: 25, median: 500000 }

# 시간대별로 결제하는 동네. home/work/weekend는 사용자 설정의 동네를 가리킨다.
# 회사가 없는 사용자(재택)는 work 대신 home을 쓴다.
zone_by_slot:
  weekday: { DAWN: home, MORNING: work, LUNCH: work, AFTERNOON: work, EVENING: { work: 0.5, home: 0.5 }, NIGHT: home }
  weekend: { DAWN: home, MORNING: home, LUNCH: { weekend: 0.6, home: 0.4 }, AFTERNOON: { weekend: 0.6, home: 0.4 }, EVENING: { weekend: 0.5, home: 0.5 }, NIGHT: home }

# 같은 동네·업종에서는 단골 3곳 중 하나를 고를 확률 (데모 사용자. 배경 사용자는 population.yml의 범위를 쓴다)
favorite_prob: 0.7

# 주말·공휴일에 업종 가중치에 곱하는 값 (모든 유형 공통, 유형별 값이 있으면 그걸 씀)
weekend_boost: { MART: 2.0, MOVIE: 2.0, APPAREL: 1.5, FUEL: 1.5 }

archetypes:
  OFFICE:
    per_day: { weekday: 3.0, weekend: 2.5 }
    amount_mult: 1.0
    slot_weight:
      weekday: { MORNING: 0.22, LUNCH: 0.30, AFTERNOON: 0.15, EVENING: 0.25, NIGHT: 0.08 }
      weekend: { MORNING: 0.10, LUNCH: 0.30, AFTERNOON: 0.25, EVENING: 0.28, NIGHT: 0.07 }
    category_weight:
      MORNING:   { CAFE: 45, CVS: 25, BAKERY: 15, FASTFOOD: 10, MEDICAL: 5 }
      LUNCH:     { REST: 60, CAFE: 25, FASTFOOD: 10, MEDICAL: 3, CVS: 2 }
      AFTERNOON: { CAFE: 30, CVS: 25, ONLINE: 20, BEAUTY: 8, APPAREL: 7, MEDICAL: 5, BOOK: 5 }
      EVENING:   { REST: 35, DELIVERY: 20, CVS: 15, SUPER: 10, MART: 5, MOVIE: 5, BOOK: 5, TAXI: 5 }
      NIGHT:     { CVS: 45, DELIVERY: 35, ONLINE: 20 }
    commute: { days: weekday, out: [8, 0, 30], back: [19, 0, 45] }   # [시, 분, 표준편차(분)]

  STUDENT:
    per_day: { weekday: 2.5, weekend: 2.2 }
    amount_mult: 0.6
    slot_weight:
      weekday: { MORNING: 0.15, LUNCH: 0.30, AFTERNOON: 0.25, EVENING: 0.20, NIGHT: 0.10 }
      weekend: { MORNING: 0.05, LUNCH: 0.30, AFTERNOON: 0.30, EVENING: 0.25, NIGHT: 0.10 }
    category_weight:
      MORNING:   { CAFE: 35, CVS: 40, BAKERY: 15, FASTFOOD: 10 }
      LUNCH:     { REST: 45, FASTFOOD: 25, CAFE: 20, CVS: 10 }
      AFTERNOON: { CAFE: 35, CVS: 30, ONLINE: 15, BOOK: 10, BEAUTY: 5, APPAREL: 5 }
      EVENING:   { REST: 30, CVS: 20, FASTFOOD: 15, DELIVERY: 15, MOVIE: 10, CAFE: 10 }
      NIGHT:     { CVS: 55, DELIVERY: 25, ONLINE: 20 }
    commute: { days: weekday, out: [9, 0, 50], back: [18, 0, 90] }

  FAMILY:
    per_day: { weekday: 2.0, weekend: 3.5 }
    amount_mult: 1.0
    slot_weight:
      weekday: { MORNING: 0.15, LUNCH: 0.25, AFTERNOON: 0.15, EVENING: 0.35, NIGHT: 0.10 }
      weekend: { MORNING: 0.10, LUNCH: 0.30, AFTERNOON: 0.30, EVENING: 0.25, NIGHT: 0.05 }
    category_weight:
      MORNING:   { CAFE: 40, BAKERY: 30, CVS: 20, MEDICAL: 10 }
      LUNCH:     { REST: 60, CAFE: 30, FASTFOOD: 10 }
      AFTERNOON: { ONLINE: 25, CAFE: 20, MEDICAL: 15, SUPER: 15, BEAUTY: 10, APPAREL: 10, BAKERY: 5 }
      EVENING:   { SUPER: 25, REST: 25, MART: 20, DELIVERY: 15, FUEL: 10, CVS: 5 }
      NIGHT:     { ONLINE: 50, CVS: 30, DELIVERY: 20 }
    weekend_boost: { MART: 2.0, FUEL: 2.0, APPAREL: 1.5, MOVIE: 2.0 }
    commute: { days: weekday, out: [8, 30, 20], back: [18, 30, 30] }
    monthly_fixed: [ { category: EDU, day: 10, amount: 250000 } ]       # 학원비

  # 데모 3번 전용. 맞벌이를 바탕으로 출근을 빼고 평일 낮 결제를 늘렸다.
  # 제공 데이터 근거: 삼성카드 온라인쇼핑 50대 여성의 홈쇼핑 39.2%, 오전 6~10시 15.7%.
  # 가정값: 병원·약국과 슈퍼 1.5배, 배달과 카페 0.7배 (오프라인 업종의 연령별 자료가 없음).
  HOME50:
    per_day: { weekday: 2.6, weekend: 2.0 }
    amount_mult: 1.0
    home_shopping_share: 0.4    # 온라인 결제 중 홈쇼핑 비율
    slot_weight:
      weekday: { MORNING: 0.22, LUNCH: 0.25, AFTERNOON: 0.30, EVENING: 0.18, NIGHT: 0.05 }
      weekend: { MORNING: 0.15, LUNCH: 0.30, AFTERNOON: 0.30, EVENING: 0.20, NIGHT: 0.05 }
    category_weight:
      MORNING:   { BAKERY: 30, CAFE: 28, CVS: 20, MEDICAL: 15, ONLINE: 8 }
      LUNCH:     { REST: 60, CAFE: 21, FASTFOOD: 10, MEDICAL: 5 }
      AFTERNOON: { ONLINE: 25, MEDICAL: 22, SUPER: 22, CAFE: 14, BEAUTY: 10, APPAREL: 10, BAKERY: 5 }
      EVENING:   { SUPER: 38, REST: 25, MART: 20, DELIVERY: 10, FUEL: 10, CVS: 5 }
      NIGHT:     { ONLINE: 50, CVS: 30, DELIVERY: 14 }
    weekend_boost: { MART: 2.0, FUEL: 2.0, APPAREL: 1.5, MOVIE: 2.0 }
    commute: { days: none }
    rides_per_day: { weekday: 0.7, weekend: 0.7 }   # 출퇴근 대신 낮에 다니는 버스·지하철
    monthly_fixed: [ { category: EDU, day: 10, amount: 250000 } ]       # 학원비

  NIGHTOWL:
    per_day: { weekday: 2.5, weekend: 2.0 }
    amount_mult: 1.0
    slot_weight:
      weekday: { MORNING: 0.15, LUNCH: 0.30, AFTERNOON: 0.15, EVENING: 0.20, NIGHT: 0.20 }
      weekend: { MORNING: 0.05, LUNCH: 0.30, AFTERNOON: 0.25, EVENING: 0.20, NIGHT: 0.20 }
    category_weight:
      MORNING:   { CAFE: 50, CVS: 35, BAKERY: 15 }
      LUNCH:     { REST: 55, CAFE: 25, FASTFOOD: 20 }
      AFTERNOON: { CAFE: 45, CVS: 30, ONLINE: 25 }
      EVENING:   { REST: 30, CVS: 25, DELIVERY: 25, FASTFOOD: 20 }
      NIGHT:     { CVS: 40, DELIVERY: 40, TAXI: 10, ONLINE: 10 }
    commute: { days: weekday, out: [9, 30, 30], back: [22, 0, 40] }

  REMOTE:
    per_day: { weekday: 2.0, weekend: 2.0 }
    amount_mult: 1.0
    slot_weight:
      weekday: { MORNING: 0.15, LUNCH: 0.30, AFTERNOON: 0.25, EVENING: 0.20, NIGHT: 0.10 }
      weekend: { MORNING: 0.15, LUNCH: 0.30, AFTERNOON: 0.25, EVENING: 0.20, NIGHT: 0.10 }
    category_weight:
      MORNING:   { CAFE: 40, BAKERY: 30, CVS: 30 }
      LUNCH:     { DELIVERY: 40, REST: 35, FASTFOOD: 15, CVS: 10 }
      AFTERNOON: { ONLINE: 40, CAFE: 35, SUPER: 10, BOOK: 10, MEDICAL: 5 }
      EVENING:   { REST: 30, DELIVERY: 25, SUPER: 20, ONLINE: 15, MOVIE: 10 }
      NIGHT:     { ONLINE: 45, CVS: 30, DELIVERY: 25 }
    commute: { days: twice_a_week, out: [10, 0, 60], back: [17, 0, 60] }

# 업종별 결제 금액: 로그정규분포 [중앙값(원), 퍼짐 sigma]. 100원 단위로 맞춘다.
# 생성 결과의 업종 평균이 제공 데이터(2020년 신한카드 시군구별·온라인소비, 구별 중앙값)에 맞도록 역산한 값이다.
#   by_slot  시간대마다 분포가 다르다. 음식점 점심·저녁 나눔은 제공 데이터에 없는 가정이고, 전체 평균을 맞췄다.
#   mix      종류가 섞인 업종. 병원·약국은 건수가 비슷해서 반반으로 뽑는다.
# 패스트푸드·제과·뷰티·택시는 기존 가정값을 유지한다 (제공 데이터와 비슷하거나, 등록지 왜곡·분류 차이로 비교 불가).
amount:
  CAFE: [6800, 0.35]
  CVS: [5800, 0.60]
  REST:
    by_slot:
      MORNING: [15000, 0.35]
      LUNCH: [15000, 0.35]
      AFTERNOON: [15000, 0.35]
      EVENING: [48000, 0.35]
      NIGHT: [48000, 0.35]
  FASTFOOD: [9000, 0.30]
  BAKERY: [8000, 0.45]
  DELIVERY: [21500, 0.35]
  MART: [35000, 0.55]
  SUPER: [14500, 0.55]
  ONLINE: [41000, 0.70]
  FUEL: [44000, 0.30]
  MOVIE: [16000, 0.25]
  BOOK: [32000, 0.45]
  BEAUTY: [22000, 0.50]
  APPAREL: [61000, 0.50]
  MEDICAL:
    mix:
      - { weight: 0.5, amount: [12500, 0.60] }   # 약국
      - { weight: 0.5, amount: [34000, 0.80] }   # 병원
  TAXI: [12000, 0.45]

# 교통 요금 (확인 필요). 거리 추가 요금은 아래 값 중 하나를 무작위로 더한다.
transit:
  modes: { 수도권 지하철: [1550, 0.7], 서울 시내버스: [1500, 0.3] }   # [기본요금, 비율]
  surcharge: [0, 0, 0, 100, 200]
  weekend_rides_per_day: 1.0

# 자동이체 (가정값). 통신비는 사용자마다 범위 안에서 한 번 정해 매달 같은 금액.
recurring:
  TELECOM: { day: 25, amount_range: [45000, 85000] }
  SUBSCR:
    count_range: [0, 2]
    prices: { 넷플릭스: 13500, 유튜브 프리미엄: 14900, 티빙: 13900, 쿠팡 와우: 7890 }
  # 공과금 (가정값). 제공 데이터의 월납/세금은 강남구·중구 등록지에 몰려 있어 비중은 쓰지 않고,
  # 다른 구의 건당 3만~8만 원 수준만 참고했다. 납부일은 사용자마다 한 번 정하고 금액은 달마다 달라진다.
  #   amount      로그정규분포 [중앙값(원), 퍼짐 sigma]
  #   month_mult  달별 배율 (냉방·난방)
  #   only        이 유형만 낸다 (없으면 전체)
  UTILITY:
    payer_share: { STUDENT: 0.5 }   # 공과금을 내는 사람의 비율 (자취생만 낸다고 본다, 없으면 전원)
    items:
      - { name: 한국전력공사, amount: [40000, 0.30], month_mult: { 8: 1.5, 9: 1.5 } }
      - { name: 도시가스, amount: [25000, 0.35], month_mult: { 8: 0.6, 9: 0.6, 10: 0.6, 11: 1.5 } }
      - { name: 아파트 관리비, amount: [180000, 0.25], only: [FAMILY, HOME50] }
