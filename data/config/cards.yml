# 카드 풀 50장 (신한 20, KB국민·하나·우리 각 10 / 신용 30, 체크 20)
# 앞쪽 12장은 데모 사용자가 쓰는 카드로 혜택 구조까지 있고, 뒤쪽 38장은 이름·종류·태그·연회비만 있다.
# 전부 가칭이다. 실제 상품이 아니라 혜택 구조만 흉내 낸 임시 카드이고,
# P1(상품설명서 추출)이 끝나면 이 파일을 실제 혜택으로 바꾼 뒤 다시 생성한다.
#
# 규칙
#   cap_groups  한도를 함께 쓰는 묶음. tiers는 전월 실적 하한(min)별 월 한도(cap).
#               전월 실적이 가장 낮은 min보다 작으면 그 묶음의 혜택은 0.
#               cap: null 이면 한도 없음.
#   benefits    rate(비율) 또는 amount(정액) 중 하나. rate_by_tier로 구간별 비율도 가능.
#               min_amount: 건당 최소 결제액, monthly_count: 월 적용 횟수 제한
#   tags        credit / check / kpass / travel
#   cap_groups·benefits는 없으면 혜택 없는 카드로 읽는다.

cards:
  # ---------------- 신한 6 ----------------
  - code: SH_LIFE_CR
    issuer: SHINHAN
    name: 신한 생활 신용(가칭)
    card_type: credit
    tags: [credit]
    annual_fee: 15000
    cap_groups:
      SH_LIFE_CR_ALL: { tiers: [ { min: 300000, cap: 10000 }, { min: 500000, cap: 20000 } ] }
    benefits:
      - { category: CAFE,     type: discount, rate: 0.10, cap_group: SH_LIFE_CR_ALL }
      - { category: CVS,      type: discount, rate: 0.05, cap_group: SH_LIFE_CR_ALL }
      - { category: DELIVERY, type: discount, rate: 0.10, cap_group: SH_LIFE_CR_ALL }

  - code: SH_DINE_CR
    issuer: SHINHAN
    name: 신한 외식 신용(가칭)
    card_type: credit
    tags: [credit]
    annual_fee: 20000
    cap_groups:
      SH_DINE_CR_ALL: { tiers: [ { min: 300000, cap: 20000 } ] }
    benefits:
      - { category: REST,     type: discount, rate: 0.10, min_amount: 10000, cap_group: SH_DINE_CR_ALL }
      - { category: FASTFOOD, type: discount, rate: 0.10, min_amount: 10000, cap_group: SH_DINE_CR_ALL }
      - { category: MOVIE,    type: discount, amount: 5000, min_amount: 10000, monthly_count: 1, cap_group: SH_DINE_CR_ALL }

  - code: SH_KPASS_CR
    issuer: SHINHAN
    name: 신한 K-패스 신용(가칭)
    card_type: credit
    tags: [credit, kpass]
    annual_fee: 0
    cap_groups:
      SH_KPASS_CR_ALL: { tiers: [ { min: 200000, cap: 5000 } ] }
    benefits:
      - { category: TRANSIT, type: point,    rate: 0.05, cap_group: SH_KPASS_CR_ALL }
      - { category: CVS,     type: discount, rate: 0.05, cap_group: SH_KPASS_CR_ALL }
      - { category: CAFE,    type: discount, rate: 0.05, cap_group: SH_KPASS_CR_ALL }

  - code: SH_TRAVEL_CK
    issuer: SHINHAN
    name: 신한 트래블 체크(가칭)
    card_type: check
    tags: [check, travel]
    annual_fee: 0
    cap_groups:
      SH_TRAVEL_CK_ALL: { tiers: [ { min: 0, cap: 3000 } ] }
    benefits:
      - { category: CAFE,   type: discount, rate: 0.05, cap_group: SH_TRAVEL_CK_ALL }
      - { category: ONLINE, type: discount, rate: 0.03, cap_group: SH_TRAVEL_CK_ALL }

  - code: SH_SHOP_CR
