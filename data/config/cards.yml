      - { category: TAXI,    type: discount, rate: 0.10, cap_group: KB_KPASS_CR_ALL }
      - { category: CVS,     type: discount, rate: 0.05, cap_group: KB_KPASS_CR_ALL }

  - code: KB_CAFE_CK
    issuer: KB
    name: KB국민 카페·뷰티 체크(가칭)
    card_type: check
    tags: [check]
    annual_fee: 0
    cap_groups:
      KB_CAFE_CK_ALL: { tiers: [ { min: 200000, cap: 6000 } ] }
    benefits:
      - { category: CAFE,   type: discount, rate: 0.10, cap_group: KB_CAFE_CK_ALL }
      - { category: BAKERY, type: discount, rate: 0.10, cap_group: KB_CAFE_CK_ALL }
      - { category: BEAUTY, type: discount, rate: 0.05, cap_group: KB_CAFE_CK_ALL }

  # ---------------- 하나 2 ----------------
  - code: HN_DELI_CR
    issuer: HANA
    name: 하나 배달·외식 신용(가칭)
    card_type: credit
    tags: [credit]
    annual_fee: 12000
    cap_groups:
      HN_DELI_CR_ALL: { tiers: [ { min: 300000, cap: 15000 } ] }
    benefits:
      - { category: DELIVERY, type: discount, rate: 0.15, min_amount: 15000, cap_group: HN_DELI_CR_ALL }
      - { category: REST,     type: discount, rate: 0.05, cap_group: HN_DELI_CR_ALL }

  - code: HN_TRAVEL_CK
    issuer: HANA
    name: 하나 트래블 체크(가칭)
    card_type: check
    tags: [check, travel]
    annual_fee: 0
    cap_groups:
      HN_TRAVEL_CK_ALL: { tiers: [ { min: 0, cap: 5000 } ] }
    benefits:
      - { category: CVS,      type: discount, rate: 0.05, cap_group: HN_TRAVEL_CK_ALL }
      - { category: FASTFOOD, type: discount, rate: 0.05, cap_group: HN_TRAVEL_CK_ALL }

  # ---------------- 우리 2 ----------------
  - code: WR_FLAT_CR
    issuer: WOORI
    name: 우리 통합할인 신용(가칭)
    card_type: credit
    tags: [credit]
    annual_fee: 10000
    cap_groups:
      WR_FLAT_CR_ALL: { tiers: [ { min: 300000, cap: 30000 } ] }
    benefits:
      - category: "*"
        type: discount
        rate_by_tier: [ { min: 300000, rate: 0.007 }, { min: 500000, rate: 0.01 } ]
