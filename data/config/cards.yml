      WR_LIFE_CK_ALL: { tiers: [ { min: 200000, cap: 7000 } ] }
    benefits:
      - { category: CVS,     type: discount, rate: 0.07, cap_group: WR_LIFE_CK_ALL }
      - { category: SUPER,   type: discount, rate: 0.07, cap_group: WR_LIFE_CK_ALL }
      - { category: MEDICAL, type: discount, rate: 0.05, cap_group: WR_LIFE_CK_ALL }
