# 가맹점 수집 규칙
# 오프라인 가맹점은 카카오 로컬 API로 구역마다 실제 위치를 받아 오고(generate/kakao_fetch.py),
# 온라인·교통·자동이체 가맹점은 아래 online 목록으로 만든다.
# 평점은 카카오가 주지 않으므로 생성기가 가상으로 붙인다.
#
# 종류(kind)와 업종(category)
#   생성기는 '종류' 단위로 가맹점을 모으고 결제 시간대·금액을 정한다 (카페와 제과는 금액 분포가 달라서 종류를 나눈다).
#   결제에 찍히는 업종은 실제 53개 업종 코드다 (config/categories.yml). 종류 → 업종은 kinds 표로 정한다.
#   브랜드가 brand_category 에 있으면 그 업종을 쓴다 (패스트푸드로 모은 써브웨이 → GREEN_FOOD).

kinds:
  # 업종은 최종 카드 DB의 58개 코드 (2026-11-15)
  CAFE:       CAFE
  BAKERY:     BAKERY
  CVS:        CONVENIENCE
  REST:       RESTAURANT
  FASTFOOD:   FAST_FOOD
  SALAD:      HEALTHY_FOOD
  MART:       MART
  SUPER:      SUPERMARKET
  FUEL:       FUEL
  MOVIE:      MOVIE
  BOOK:       BOOKSTORE
  HNB:        HNB              # 다이소는 새 DB 브랜드 업종(GENERAL_GOODS)을 따른다
  MEDICAL:    HOSPITAL         # 카카오 분류에 '약국'이 있으면 PHARMACY (category_by_kakao)
  EDU:        EDUCATION
  DEPT:       DEPARTMENT_STORE
  OUTLET:     OUTLET
  STUDY:      STUDY_ROOM
  STATIONERY: STATIONERY
  PHOTO:      PHOTO_BOOTH
  HAIR:       BEAUTY_SALON
  FITNESS:    FITNESS
  PARKING:    PARKING
  OPTICAL:    EYEWEAR
  THEMEPARK:  AMUSEMENT_PARK
  VET:        PET
  GOLFRANGE:  GOLF
  GOLFCLUB:   GOLF
  CARFIX:     OTHER            # 새 DB에 차량 정비 업종이 없어 기타로 둔다
  # 위치가 없는 종류
  DELIVERY:   DELIVERY
  ONLINE:     ONLINE_SHOPPING
  HOMESHOP:   HOME_SHOPPING
  EBOOK:      BOOKSTORE
  APPSTORE:   APP_STORE
  TAXI:       TAXI
  TRANSIT:    TRANSIT
  TELECOM:    TELECOM
  UTILITY:    UTILITY
  OTT:        DIGITAL_SUBSCRIPTION
  MEMBERSHIP: MEMBERSHIP
  MUSIC:      DIGITAL_SUBSCRIPTION
  EVCHARGE:   EV_CHARGING
  INTERCITY:  INTERCITY_TRANSIT
  EASYPAY:    MOBILE_PAY
  TICKET:     CULTURE_TICKET
  EBOOKAPP:   BOOKSTORE
  FRESH:      ONLINE_GROCERY

# 카카오 분류 이름으로 업종을 나눈다 (종류 → {분류에 들어 있는 말: 업종})
category_by_kakao:
  MEDICAL: { 약국: PHARMACY }

# 이름이 브랜드 표기로 시작하지만 그 브랜드가 아닌 가게 (홈플러스 익스프레스는 홈플러스 대형마트 혜택 대상이 아님)
brand_exclude: [홈플러스 익스프레스]
# 이름에 브랜드가 들어 있어도 업종을 바꾸지 않는 종류 (현대백화점 주차장은 백화점 결제가 아니다)
keep_category_kinds: [PARKING]

# 구역마다 종류별로 뽑을 수
per_zone_quota:
  CAFE: 12
  BAKERY: 3
  CVS: 8
  REST: 13
  FASTFOOD: 4
  SALAD: 1
  MART: 2
  SUPER: 3
  FUEL: 2
  MOVIE: 1
  BOOK: 1
  HNB: 3
  MEDICAL: 5
  EDU: 2
  DEPT: 1
  OUTLET: 1
  STUDY: 2
  STATIONERY: 1
  PHOTO: 1
  HAIR: 2
  FITNESS: 2
  PARKING: 2
  OPTICAL: 1
  THEMEPARK: 1
  VET: 2
  GOLFRANGE: 1
  GOLFCLUB: 1
  CARFIX: 1

# 최종 카드 DB 혜택 대상인데 기존 수집에 없던 브랜드 (2026-11-15). 구역마다 이만큼 더 뽑아 원래 종류에 합친다.
extra_zone_quota:
  XCAFE: 2
  XBAKERY: 1
  XFASTFOOD: 1
  XFUEL: 1
  XMART: 1
  XREST: 1
  XDEPT: 1
kind_fold: { XCAFE: CAFE, XBAKERY: BAKERY, XFASTFOOD: FASTFOOD, XFUEL: FUEL, XMART: MART, XREST: REST, XDEPT: DEPT }

# 카카오 검색 방법
#   group    카테고리 그룹 코드로 검색 (CE7 카페, CS2 편의점, FD6 음식점, MT1 대형마트,
#            OL7 주유소, HP8 병원, PM9 약국, AC5 학원, PK6 주차장)
#   keyword  키워드로 검색. 결과의 place_name에 키워드가 들어 있는 것만 남긴다.
#   include / exclude  category_name에 이 문자열이 있으면 남기거나 뺀다.
#   sort      accuracy 면 정확도순 (기본은 거리순). 안쪽 매장이 많은 백화점·아울렛·테마파크에 쓴다.
#   radius_m  이 검색만 반경을 따로 쓴다. 대형마트·주유·영화처럼 일부러 찾아가는 업종은 넓게 잡는다.
# 음식점 카테고리 검색은 가까운 45곳까지만 주고 대부분 한식이라, 패스트푸드·제과는 브랜드 이름으로 따로 찾는다.
# 한 가게가 여러 종류 검색에 잡히면 위에 먼저 적힌 종류로 본다.
kakao_sources:
  CAFE:     [ { group: CE7, exclude: ["제과,베이커리", "테마카페"] } ]
  CVS:      [ { group: CS2 } ]
  FASTFOOD:
    - { group: FD6, include: ["패스트푸드"] }
    - { keyword: 맥도날드 }
    - { keyword: 버거킹 }
    - { keyword: 롯데리아 }
    - { keyword: 맘스터치 }
    - { keyword: KFC }
    - { keyword: 서브웨이 }
  SALAD:
    - { keyword: 샐러디, radius_m: 1000 }
    - { keyword: 포케올데이, radius_m: 1000 }
  BAKERY:
    - { group: FD6, include: ["제과,베이커리"] }
    - { keyword: 파리바게뜨 }
    - { keyword: 뚜레쥬르 }
  REST:     [ { group: FD6, exclude: ["패스트푸드", "제과,베이커리", "카페", "간식"] } ]
  MART:     [ { group: MT1, include: ["대형마트"], radius_m: 2000 } ]
  SUPER:
    - { group: MT1, include: ["슈퍼", "식자재"] }
    - { keyword: GS더프레시, radius_m: 1000 }
    - { keyword: 롯데슈퍼, radius_m: 1000 }
    - { keyword: 이마트에브리데이, radius_m: 1000 }
    - { keyword: 홈플러스 익스프레스, radius_m: 1000 }
    - { keyword: 식자재마트, radius_m: 1000 }
  FUEL:     [ { group: OL7, include: ["주유소"], radius_m: 2000 } ]
  MOVIE:
    - { keyword: CGV, include: ["영화관"], radius_m: 2000 }
    - { keyword: 메가박스, include: ["영화관"], radius_m: 2000 }
    - { keyword: 롯데시네마, include: ["영화관"], radius_m: 2000 }
  BOOK:
    - { keyword: 교보문고, include: ["서점"], radius_m: 2000 }
    - { keyword: 영풍문고, include: ["서점"], radius_m: 2000 }
    - { keyword: 알라딘, include: ["서점"], radius_m: 2000 }
  HNB:      [ { keyword: 올리브영, radius_m: 2000 }, { keyword: 다이소, radius_m: 2000 } ]
  MEDICAL:  [ { group: HP8 }, { group: PM9 } ]
  EDU:      [ { group: AC5 } ]
  # 백화점·아울렛은 브랜드명으로 찾으면 안쪽 매장이 45건 한도를 채워서 지점명으로 찾는다
  DEPT:
    - { keyword: 현대백화점 판교점, include: ["백화점"], radius_m: 5000, sort: accuracy }
    - { keyword: 현대백화점 신촌점, include: ["백화점"], radius_m: 5000, sort: accuracy }
    - { keyword: 현대백화점 압구정본점, include: ["백화점"], radius_m: 5000, sort: accuracy }
    - { keyword: 현대백화점 무역센터점, include: ["백화점"], radius_m: 5000, sort: accuracy }
    - { keyword: 현대백화점 디큐브시티, include: ["백화점"], radius_m: 5000, sort: accuracy }
    - { keyword: 롯데백화점 강남점, include: ["백화점"], radius_m: 5000, sort: accuracy }
    - { keyword: 롯데백화점 관악점, include: ["백화점"], radius_m: 5000, sort: accuracy }
    - { keyword: 롯데백화점 잠실점, include: ["백화점"], radius_m: 5000, sort: accuracy }
    - { keyword: 신세계백화점 강남점, include: ["백화점"], radius_m: 5000, sort: accuracy }
    - { keyword: 신세계백화점 타임스퀘어점, include: ["백화점"], radius_m: 5000, sort: accuracy }
    - { keyword: 갤러리아 명품관, include: ["백화점"], radius_m: 5000, sort: accuracy }
  OUTLET:
    - { keyword: 마리오아울렛, include: ["상설할인매장", "아울렛"], radius_m: 6000, sort: accuracy }
    - { keyword: 현대시티아울렛, include: ["상설할인매장", "아울렛"], radius_m: 6000, sort: accuracy }
    - { keyword: W몰, include: ["상설할인매장", "아울렛"], radius_m: 6000, sort: accuracy }
    - { keyword: 뉴코아아울렛, include: ["상설할인매장", "아울렛"], radius_m: 6000, sort: accuracy }
    - { keyword: 2001아울렛, include: ["상설할인매장", "아울렛"], radius_m: 6000, sort: accuracy }
    - { keyword: 롯데아울렛, include: ["상설할인매장", "아울렛"], radius_m: 6000, sort: accuracy }
  STUDY:
    - { keyword: 스터디카페 }
    - { keyword: 독서실 }
  STATIONERY:
    - { keyword: 문구, include: ["문구"] }
    - { keyword: 모닝글로리, include: ["문구"] }
  PHOTO:
    - { keyword: 인생네컷 }
    - { keyword: 포토이즘 }
    - { keyword: 하루필름 }
    - { keyword: 포토그레이 }
  HAIR:     [ { keyword: 미용실, include: ["미용"] }, { keyword: 헤어, include: ["미용"] } ]
  FITNESS:
    - { keyword: 헬스, include: ["스포츠"] }
    - { keyword: 피트니스, include: ["스포츠"] }
    - { keyword: 필라테스, include: ["스포츠"] }
  PARKING:  [ { group: PK6 } ]
  OPTICAL:  [ { keyword: 안경, include: ["안경"] } ]
  THEMEPARK:
    - { keyword: 롯데월드 어드벤처, include: ["테마파크"], exclude: ["테마파크시설"], radius_m: 20000, sort: accuracy }
    - { keyword: 서울랜드, include: ["테마파크"], exclude: ["테마파크시설"], radius_m: 20000, sort: accuracy }
    - { keyword: 에버랜드, include: ["테마파크"], exclude: ["테마파크시설"], radius_m: 20000, sort: accuracy }

  VET:
    - { keyword: 동물병원, include: ["동물병원"] }
  GOLFRANGE:
    - { keyword: 골프연습장, include: ["골프"], radius_m: 2000 }
    - { keyword: 스크린골프, include: ["골프"] }
  GOLFCLUB:
    - { keyword: 컨트리클럽, include: ["골프장"], radius_m: 20000, sort: accuracy }
    - { keyword: CC, include: ["골프장"], radius_m: 20000, sort: accuracy }
  CARFIX:
    - { keyword: 스피드메이트, include: ["정비"], radius_m: 3000 }
    - { keyword: 자동차정비, include: ["정비"], radius_m: 2000 }
  # 최종 카드 DB 혜택 대상 브랜드 추가 수집 (2026-11-15)
  XCAFE:
    - { keyword: 폴바셋, radius_m: 3000 }
    - { keyword: 탐앤탐스, radius_m: 3000 }
    - { keyword: 엔제리너스, radius_m: 3000 }
    - { keyword: 카페베네, radius_m: 3000 }
  XBAKERY:
    - { keyword: 던킨, radius_m: 3000 }
    - { keyword: 배스킨라빈스, radius_m: 2000 }
    - { keyword: 파리크라상, radius_m: 5000 }
  XFASTFOOD:
    - { keyword: 쉐이크쉑, radius_m: 6000 }
    - { keyword: 파이브가이즈, radius_m: 8000 }
  XFUEL:
    - { keyword: S-OIL, include: ["주유소"], radius_m: 3000 }
    - { keyword: 알뜰주유소, include: ["주유소"], radius_m: 4000 }
  XMART:
    - { keyword: 트레이더스, include: ["대형마트", "창고형"], radius_m: 10000, sort: accuracy }
  XREST:
    - { keyword: 빕스, radius_m: 5000 }
    - { keyword: TGIF, radius_m: 8000 }
  XDEPT:
    - { keyword: AK플라자, include: ["백화점"], radius_m: 15000, sort: accuracy }

