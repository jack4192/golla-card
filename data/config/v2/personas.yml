# v2 사용자 유형과 데모 사용자 (2026-11-22 사용자 결정). 기본 personas.yml 위에 겹쳐 쓴다.
archetypes:
  HOMEMAKER:
    name: 전업주부
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: category_habit, main_prob: 0.3 }
  SELFEMP:
    name: 자영업자
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: category_habit, main_prob: 0.4 }
  SHIFT:
    name: 교대근무
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: main_card }
  FIELD:
    name: 영업·외근직
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: category_habit, main_prob: 0.5 }
  RETIRED:
    name: 은퇴자
    habit: { habit: 0.85, random: 0.15 }
    choice_model: { type: category_habit, main_prob: 0.3 }

