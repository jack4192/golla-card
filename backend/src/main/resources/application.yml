spring:
  application:
    name: paymate-backend

  # backend/.env (DB 접속 정보·JWT 비밀키·AI 주소)를 자동으로 읽는다. 없으면 환경 변수를 쓴다.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET}
  # 로그인 유지 시간(ms). 2026-11-24 팀 결정 12시간 (예전 1시간). JWT_ACCESS_EXPIRE_MS 로 바꿀 수 있다
  access-token-expire-time: ${JWT_ACCESS_EXPIRE_MS:43200000}

# AI 엔진(solpay-ai, FastAPI) 연결
ai:
  base-url: ${AI_BASE_URL:http://localhost:8001}
  # AI 엔진의 SOLPAY_INTERNAL_TOKEN 과 같은 값. 비우면 헤더를 보내지 않는다
  internal-token: ${AI_INTERNAL_TOKEN:}
  # 카드 배치 제한 시간(ms). 넘기면 기본 순서로 답한다.
  # 공용 RDS 에서 사용자별 이달 첫 계산이 0.9~1.9초라 2초 (2026-11-24 팀 결정, 예전 0.8초). 앱은 4초까지 기다린다
  rank-timeout-ms: ${AI_RANK_TIMEOUT_MS:2000}
  # 챗봇·리포트 등 나머지 호출 제한 시간(ms)
  timeout-ms: ${AI_TIMEOUT_MS:20000}
  # 일정 '직접 입력' 이름 분류 제한 시간(ms). 일정 저장 중에 부르므로 짧게 둔다
  classify-timeout-ms: ${AI_CLASSIFY_TIMEOUT_MS:3000}
  # 시연용 기준 시각 (예: 2026-11-05T09:30:00). 비우면 현재 시각
  fixed-at: ${AI_FIXED_AT:}

app:
  # 회원 탈퇴로 지우지 않는 데모·가상 계정 번호 상한 (가상 데이터 1~1005번, 2026-11-24)
  withdrawal:
    protected-max-user-id: ${WITHDRAWAL_PROTECTED_MAX_USER_ID:1005}
  # 가상 POS 시연용 만능 키 (2026-11-24). 이 키로 온 POS 요청은 POS 가 고른 가맹점으로 결제한다.
  # 비우면(기본) 꺼짐, 16자 이상이어야 켜진다. 값은 backend/.env 에만 두고 GitHub 에 올리지 않는다
  pos:
    demo-terminal-key: ${POS_DEMO_TERMINAL_KEY:}
  # 바탕화면 웹앱 아침 일정 웹 푸시 (2026-11-25). 키는 backend/.env(EC2)에만, GitHub 에 올리지 않는다.
  # 키가 없으면 알림 기능만 꺼진다. 매일 7시 알림은 morning-enabled=on 인 서버(EC2)에서만 보낸다
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:https://paymate.duckdns.org}
    morning-enabled: ${PUSH_MORNING_ENABLED:off}

# 웹(Expo 웹, Vercel)에서 부를 수 있게 허용할 주소 (쉼표 구분)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

# 프록시(배포 서버의 Caddy) 뒤에서는 프록시가 알려 주는 원래 주소(X-Forwarded-Proto·Host)를 믿는다 (2026-11-25).
# 안 그러면 https://paymate.duckdns.org/pos 화면이 같은 주소로 보낸 결제(POST)를 다른 사이트로 보고 CORS 로 막는다(403).
# native = Tomcat 이 내부 주소(127.x·172.16~31.x 등, docker 포함)에서 온 머리글만 믿는다.
server:
  forward-headers-strategy: native

logging.level:
  org.hibernate.SQL: debug
