# 로컬 개발용 DB. 앱 3개(Spring, FastAPI, React)는 로컬에서 따로 실행한다.
# 비밀번호는 같은 폴더의 .env (깃 제외) 에서 읽는다. .env.example 참고.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: solpay-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solpay}
      POSTGRES_USER: ${POSTGRES_USER:-solpay_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣어 주세요}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - solpay-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  solpay-db:
