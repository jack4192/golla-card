<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가상 POS (데모)</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:,">
</head>
<body>
<main class="pos">
  <header>
    <h1>가상 POS</h1>
  </header>

  <div class="grid">
    <form class="box" id="form" autocomplete="off">
      <h2>결제 요청</h2>
      <label for="merchant">가맹점</label>
      <select id="merchant" required></select>
      <label for="category">업종</label>
      <input id="category" readonly>
      <label for="amount">금액(원)</label>
      <input id="amount" type="number" value="13000" min="1" max="10000000" required>
      <label for="token">바코드·QR 번호 (스캐너로 찍거나 직접 입력 후 Enter)</label>
      <input id="token" class="code" inputmode="numeric" placeholder="18자리 숫자" required autofocus>
      <button class="btn primary block" type="submit" id="approveBtn">승인 요청</button>
      <!-- 카메라로 QR·바코드 찍기 (2026-11-24): 인식되면 번호를 채우고 바로 승인 요청 -->
      <button class="btn block scan" type="button" id="scanBtn">📷 카메라로 QR·바코드 찍기</button>
      <div class="scanner" id="scanner" hidden>
        <video id="scanVideo" playsinline muted></video>
        <div class="scan-frame"></div>
        <button class="btn small scan-close" type="button" id="scanClose">닫기</button>
        <p class="scan-msg" id="scanMsg">QR이나 바코드를 네모 안에 비춰 주세요.</p>
      </div>
      <p class="muted small" id="paymentHint">승인된 가상 결제는 결제 내역에 저장됩니다.</p>
    </form>

    <section class="box result" id="result">
      <p class="muted">바코드·QR 번호를 입력하면 여기에 승인 결과가 표시됩니다.</p>
    </section>
  </div>

  <section class="box" style="margin-top:16px">
    <h2>서버에 쌓인 거래 내역 <span class="muted" style="font-weight:400">(최근 20건, 3초마다 갱신)</span></h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>시연 시각</th><th>결과</th><th>가맹점</th><th>업종</th><th class="num">금액</th><th>카드</th><th class="num">혜택</th><th>가장 유리했던 카드 / 거절 사유</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const won = (n) => (n == null ? "—" : n.toLocaleString("ko-KR") + "원");
const DAYS = "일월화수목금토";
const when = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso), p = (n) => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}/${d.getDate()}(${DAYS[d.getDay()]}) ${p(d.getHours())}:${p(d.getMinutes())}`;
};
let byId = {};

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined && text !== null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

async function loadMerchants() {
  const [opts, st] = await Promise.all([
    fetch("/api/demo/options").then((r) => r.json()),
    fetch("/api/demo/state").then((r) => r.json()),
  ]);
  const user = opts.users.find((u) => u.user_id === st.user_id);
  const order = [...user.zones.map((z) => z.code), ...Object.keys(opts.merchants).filter((z) => !user.zones.some((u) => u.code === z))];
  byId = {};
  const groups = order.filter((z) => opts.merchants[z]).map((z) => {
    const g = document.createElement("optgroup");
    const role = user.zones.find((u) => u.code === z);
    g.label = (opts.zones[z] || z) + (role ? ` (${role.role})` : "");   // 구역이 없으면 서버가 업종 이름으로 묶는다
    for (const m of opts.merchants[z]) {
      byId[m.merchant_id] = m;
      const o = el("option", `${m.name} · ${m.category_name}`); o.value = m.merchant_id; g.append(o);
    }
    return g;
  });
  $("merchant").replaceChildren(...groups);
  if (opts.uses_fixed_pos) $("amount").min = "100";
  const available = $("merchant").options.length > 0;
  $("approveBtn").disabled = !available;
  $("scanBtn").disabled = !available;
  if (!available) $("paymentHint").textContent = "결제 가능한 가맹점을 불러오지 못했습니다.";
  onMerchant();
}

function onMerchant() {
  const m = byId[$("merchant").value];
  if (!m) return;
  $("category").value = m.category_name;
  $("amount").value = m.typical_amount;
}
$("merchant").onchange = onMerchant;

$("form").onsubmit = async (ev) => {
  ev.preventDefault();
  if ($("approveBtn").disabled) return;
  $("approveBtn").disabled = true;
  $("scanBtn").disabled = true;
  const body = { token: $("token").value, merchant_id: Number($("merchant").value), amount: Number($("amount").value) };
  const box = $("result");
  try {
    const res = await fetch("/api/pos/approve", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "입력값을 확인하세요 (금액은 1원 이상).");
    const ok = data.result === "APPROVED";
    box.className = "box result " + (ok ? "ok" : "bad");
    let lines;
    if (ok) {
      const benefit = data.benefit == null ? "혜택 계산 안 됨 (AI 꺼짐)" : `혜택 ${won(data.benefit)}`;
      const best = data.best_benefit != null && data.best_benefit > (data.benefit || 0)
        ? `${data.best_card}였다면 ${won(data.best_benefit)}` : (data.benefit == null ? "" : "가장 유리한 카드로 결제");
      lines = [el("p", `${data.merchant} · ${won(data.amount)}`)];
      if (data.card) lines.push(el("p", data.card));
      lines.push(el("p", benefit, "strong"));
      if (!data.uses_fixed_pos && best) lines.push(el("p", best, "muted"));
      lines.push(el("p", `승인번호 ${data.approval_no}`, "muted"));
    } else {
      lines = [el("p", data.reason), el("p", `${data.merchant} · ${won(data.amount)}`, "muted")];
    }
    box.replaceChildren(el("div", ok ? "승인" : "거절", "big"), ...lines);
  } catch (e) {
    box.className = "box result bad";
    box.replaceChildren(el("div", "오류", "big"), el("p", e.message));
  } finally {
    $("approveBtn").disabled = false;
    $("scanBtn").disabled = false;
  }
  $("token").value = "";
  $("token").focus();
  loadRows();
};

async function loadRows() {
  try {
    const rows = await (await fetch("/api/transactions?limit=20")).json();
    $("rows").replaceChildren(...rows.map((r) => {
      const tr = document.createElement("tr");
      const ok = r.result === "APPROVED";
      const tagCell = el("td");
      tagCell.append(el("span", ok ? "승인" : "거절", "tag " + (ok ? "ok" : "bad")));
      const card = r.card_name ? r.card_name + (r.ai_rank ? ` (AI ${r.ai_rank}순위)` : "") : "—";
      const best = !ok ? r.reason
        : r.best_card == null ? "—"
        : r.best_benefit > (r.benefit || 0) ? `${r.best_card} ${won(r.best_benefit)}` : "이 카드가 가장 유리";
      tr.append(el("td", when(r.demo_at)), tagCell, el("td", r.merchant), el("td", r.category),
                el("td", won(r.amount), "num"), el("td", card), el("td", ok ? won(r.benefit) : "", "num"), el("td", best));
      return tr;
    }));
  } catch (e) { /* 다음 주기에 다시 시도 */ }
}

// ---------- 카메라 스캔 ----------
// 브라우저에 BarcodeDetector 가 있으면 그것을, 없으면(윈도우 크롬 등) ZXing 라이브러리를 불러와 쓴다.
const ZXING_URL = "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js";
let scan = null;   // { stream, timer, controls }

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error("인식 라이브러리를 불러오지 못했어요 (인터넷 연결 확인)."));
    document.head.append(s);
  });
}

function stopScan() {
  if (scan) {
    clearInterval(scan.timer);
    scan.controls?.stop();
    scan.stream?.getTracks().forEach((t) => t.stop());
  }
  scan = null;
  $("scanVideo").srcObject = null;
  $("scanner").hidden = true;
  $("scanBtn").hidden = false;
}

function onScanned(text) {
  const code = String(text || "").trim();
  if (!code || !scan) return;
  stopScan();
  $("token").value = code;
  $("form").requestSubmit();   // 찍히면 바로 승인 요청
}

async function startScan() {
  const msg = $("scanMsg");
  if (!navigator.mediaDevices?.getUserMedia) {
    alert("이 주소에서는 카메라를 쓸 수 없어요. localhost 또는 https 주소로 열어 주세요.");
    return;
  }
  $("scanner").hidden = false;
  $("scanBtn").hidden = true;
  msg.textContent = "카메라를 켜는 중이에요…";
  scan = {};
  const video = $("scanVideo");
  try {
    if ("BarcodeDetector" in window) {
      const detector = new BarcodeDetector({ formats: ["qr_code", "code_128"] });
      scan.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      video.srcObject = scan.stream;
      await video.play();
      msg.textContent = "QR이나 바코드를 네모 안에 비춰 주세요.";
      scan.timer = setInterval(async () => {
        try {
          const found = await detector.detect(video);
          if (found.length) onScanned(found[0].rawValue);
        } catch { /* 다음 프레임에 다시 */ }
      }, 250);
    } else {
      await loadScript(ZXING_URL);
      if (!scan) return;   // 불러오는 사이에 닫음
      const reader = new ZXingBrowser.BrowserMultiFormatReader();
      msg.textContent = "QR이나 바코드를 네모 안에 비춰 주세요.";
      scan.controls = await reader.decodeFromVideoDevice(undefined, video, (result) => {
        if (result) onScanned(result.getText());
      });
    }
  } catch (e) {
    stopScan();
    const denied = e && (e.name === "NotAllowedError" || e.name === "SecurityError");
    alert(denied ? "카메라 사용을 허용해 주세요 (주소창 왼쪽 자물쇠 → 카메라 허용)." : (e.message || "카메라를 켜지 못했어요."));
  }
}

$("scanBtn").onclick = startScan;
$("scanClose").onclick = () => { stopScan(); $("token").focus(); };

loadMerchants();
loadRows();
setInterval(loadRows, 3000);
</script>
</body>
</html>
